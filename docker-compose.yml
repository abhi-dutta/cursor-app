# Run the full stack locally the same way it runs in the cluster (same hardening):
#   docker compose up --build        ->  http://localhost:8080
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      APP_ENVIRONMENT: compose
    expose:
      - "3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-local}
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,size=1m
      - /tmp:uid=101,gid=101,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
