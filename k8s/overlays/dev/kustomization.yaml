apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spec-demo-dev

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - APP_ENVIRONMENT=dev
      # Creates Jira Tasks for unhandled 500s, but only when the secret below exists.
      # Create it out of band; never commit the API token:
      #   kubectl -n spec-demo-dev create secret generic jira-incident-credentials \
      #     --from-literal=email='you@example.com' --from-literal=token='<jira api token>'
      - INCIDENT_REPORTING=true
      - JIRA_BASE_URL=https://abhishekd07.atlassian.net
      - JIRA_PROJECT_KEY=SCRUM

# Small footprint for dev
patches:
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: JIRA_EMAIL
            valueFrom:
              secretKeyRef:
                name: jira-incident-credentials
                key: email
                optional: true
          - name: JIRA_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: jira-incident-credentials
                key: token
                optional: true
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
