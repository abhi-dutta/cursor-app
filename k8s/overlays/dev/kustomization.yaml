apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spec-demo-dev

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - APP_ENVIRONMENT=dev
      # Posts unhandled 500s to Jira only when the secret below exists.
      # Create it out of band; do not commit the webhook URL:
      #   kubectl -n spec-demo-dev create secret generic jira-incident-webhook --from-literal=url='https://...'
      - INCIDENT_REPORTING=true

# Small footprint for dev
patches:
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: JIRA_INCIDENT_WEBHOOK_URL
            valueFrom:
              secretKeyRef:
                name: jira-incident-webhook
                key: url
                optional: true
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
