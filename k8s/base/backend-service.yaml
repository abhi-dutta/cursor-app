apiVersion: v1
kind: Service
metadata:
  name: backend            # nginx in the frontend pod proxies /api/ to http://backend:3000
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: spec-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 3000
      targetPort: http
