# Dedicated, permission-less identities. Neither workload talks to the Kubernetes API,
# so no token is mounted into the pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: spec-demo
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: spec-demo
automountServiceAccountToken: false
