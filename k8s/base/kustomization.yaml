apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml

configMapGenerator:
  - name: backend-config
    literals:
      - APP_ENVIRONMENT=base

# Point these at your Artifact Registry repo. Harness CD can override the tag per
# deployment, or from the CLI:  kustomize edit set image spec-demo-backend=<repo>/backend:<tag>
images:
  - name: spec-demo-backend
    newName: REGION-docker.pkg.dev/PROJECT_ID/spec-demo/backend
    newTag: latest
  - name: spec-demo-frontend
    newName: REGION-docker.pkg.dev/PROJECT_ID/spec-demo/frontend
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/part-of: spec-demo
    includeSelectors: false
