apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: backend-config
    literals:
      - APP_ENVIRONMENT=base
      # X-Forwarded-For is trusted ONLY from these peers (the nginx frontend pods, which sit in the
      # cluster's private pod range; the NetworkPolicy also blocks every other source). If your pod
      # CIDR is not RFC1918 (e.g. GKE with a custom/class-E range), replace with that CIDR.
      - TRUSTED_PROXIES=uniquelocal
      - RATE_LIMIT_PER_MIN=600
      - WRITE_RATE_LIMIT_PER_MIN=60

# Images are placed by the pipeline: Harness patches the containers with the exact artifact it
# just built (see k8s/harness/patch-images.yaml). For manual deploys use:
#   kustomize edit set image spec-demo-backend=docker.io/dutabhis/spec-demo-backend:<tag> \
#                            spec-demo-frontend=docker.io/dutabhis/spec-demo-frontend:<tag>
# The tag below is deliberately not a real one, so nothing deploys an unintended image.
images:
  - name: spec-demo-backend
    newName: docker.io/dutabhis/spec-demo-backend
    newTag: set-by-pipeline
  - name: spec-demo-frontend
    newName: docker.io/dutabhis/spec-demo-frontend
    newTag: set-by-pipeline

labels:
  - pairs:
      app.kubernetes.io/part-of: spec-demo
    includeSelectors: false
